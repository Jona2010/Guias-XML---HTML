<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector de Guías SUNAT | Profesional V3</title>

<link rel="icon" href="Logo_XML_HTML.png" type="image/png">
<meta name="description" content="Sistema profesional para visualizar y exportar guías de remisión SUNAT XML.">
<link rel="stylesheet" href="styles.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js?v=5" defer></script>
</head>
<body>

<header class="header">
    <div class="header-left">
        <img src="Logo_XML.png" alt="Logo SUNAT" class="logo-header" onerror="this.style.display='none'">
        <div>
            <h1>Sistema de Guías de Remisión SUNAT</h1>
            <span class="version">v3.0</span>
        </div>
    </div>
</header>

<div class="app-container">

    <!-- TOOLBAR SUPERIOR -->
    <div class="top-toolbar">
        <div class="toolbar-left">
            <div class="file-wrapper">
                <label for="xmlfile" class="btn-file">
                    <i class="fa-solid fa-folder-open"></i> Seleccionar XML
                </label>
                <input type="file" id="xmlfile" accept=".xml">
                <span id="file-name">Ningún archivo seleccionado</span>
            </div>
            <button class="btn btn-primary" onclick="leerGuia()">
                <i class="fa-solid fa-upload"></i> Procesar
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-excel" onclick="exportarExcel()">
                <i class="fa-solid fa-file-excel"></i> Excel
            </button>
            <button class="btn btn-pdf" onclick="exportarPDF()">
                <i class="fa-solid fa-file-pdf"></i> PDF
            </button>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">

        <!-- HISTORIAL -->
        <aside class="historial-panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> Historial</h2>
                <small>Últimas guías</small>
            </div>

            <div class="buscador-wrapper">
                <div class="search-toolbar">
                    <span class="icono-lupa"><i class="fa-solid fa-search"></i></span>
                    <input id="buscador" type="text" placeholder="Buscar guía, cliente o producto..." autocomplete="off">
                    <button id="btn-limpiar" onclick="limpiarBusqueda()" title="Limpiar">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- CONTROLES DE ORDENAMIENTO (solo visible en búsqueda) -->
                <div id="orden-controls" style="display:none; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:4px;">
                    <span style="font-size:12px; color:var(--text-secondary); font-weight:500;">
                        <i class="fa-solid fa-arrow-up-wide-short"></i> Ordenar:
                    </span>
                    <button class="btn-orden" id="orden-toggle-btn" onclick="toggleOrdenDireccion()" style="background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:65px; justify-content:center;">
                        <i class="fa-solid fa-arrow-down-wide-short"></i> DESC
                    </button>
                </div>

                <div class="filtro-fechas">
                    <input type="date" id="fecha-desde" title="Fecha desde">
                    <input type="date" id="fecha-hasta" title="Fecha hasta">
                    <button class="btn-icon" onclick="filtrarPorFecha()" title="Filtrar">
                        <i class="fa-solid fa-filter"></i>
                    </button>
                    <button class="btn-icon" onclick="limpiarFiltroFecha()" title="Limpiar filtros">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>

            <!-- =====================================================
                BÚSQUEDA AVANZADA
            ====================================================== -->
            <div class="busqueda-avanzada">

                <!-- BOTÓN ABRIR / CERRAR -->
                <button
                    type="button"
                    id="btn-toggle-avanzada"
                    class="btn-toggle-avanzada"
                >
                    <span>
                        <i class="fa-solid fa-sliders"></i>
                        Búsqueda avanzada
                    </span>

                    <i
                        id="icono-toggle-avanzada"
                        class="fa-solid fa-chevron-down"
                    ></i>
                </button>


                <!-- PANEL -->
                <div
                    id="panel-busqueda-avanzada"
                    class="panel-busqueda-avanzada"
                    style="display:none;"
                >

                    <!-- PRODUCTO -->
                    <div class="campo-avanzado campo-avanzado-completo">

                        <label for="av-producto">
                            <i class="fa-solid fa-box"></i>
                            Producto, herramienta o equipo
                        </label>

                        <input
                            type="text"
                            id="av-producto"
                            placeholder="Ej. multimetro mestek"
                            autocomplete="off"
                        >

                    </div>


                    <!-- PARTIDA -->
                    <div class="campo-avanzado campo-avanzado-completo">

                        <label for="av-partida">
                            <i class="fa-solid fa-location-dot"></i>
                            Punto de partida
                        </label>

                        <input
                            type="text"
                            id="av-partida"
                            placeholder="Ej. Malaga Grenet"
                            autocomplete="off"
                        >

                    </div>


                    <!-- LLEGADA -->
                    <div class="campo-avanzado campo-avanzado-completo">

                        <label for="av-llegada">
                            <i class="fa-solid fa-location-crosshairs"></i>
                            Punto de llegada
                        </label>

                        <input
                            type="text"
                            id="av-llegada"
                            placeholder="Ej. Tinajones"
                            autocomplete="off"
                        >

                    </div>


                    <!-- FECHAS -->
                    <div class="fila-fechas-avanzada">

                        <div class="campo-avanzado">

                            <label for="av-desde">
                                <i class="fa-regular fa-calendar"></i>
                                Desde
                            </label>

                            <input
                                type="date"
                                id="av-desde"
                            >

                        </div>


                        <div class="campo-avanzado">

                            <label for="av-hasta">
                                <i class="fa-regular fa-calendar-check"></i>
                                Hasta
                            </label>

                            <input
                                type="date"
                                id="av-hasta"
                            >

                        </div>

                    </div>


                    <!-- BOTONES -->
                    <div class="acciones-busqueda-avanzada">

                        <button
                            type="button"
                            id="btn-buscar-avanzado"
                            class="btn btn-primary"
                        >
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Buscar
                        </button>


                        <button
                            type="button"
                            id="btn-limpiar-avanzado"
                            class="btn-limpiar-avanzado"
                        >
                            <i class="fa-solid fa-rotate-left"></i>
                            Limpiar
                        </button>

                    </div>

                </div>

            </div>



            <!-- =====================================================
                 BARRA DE SELECCIÓN DE RESULTADOS
                 Aparecerá únicamente durante búsqueda avanzada
            ====================================================== -->
            <div
                id="barra-seleccion-guias"
                class="barra-seleccion-guias"
                style="display:none;"
            >

                <div class="seleccion-superior">

                    <label class="seleccionar-todas-wrapper">

                        <input
                            type="checkbox"
                            id="seleccionar-todas-guias"
                        >

                        <span>
                            Seleccionar todas
                        </span>

                    </label>


                    <span
                        id="contador-seleccionadas"
                        class="contador-seleccionadas"
                    >
                        0 seleccionadas
                    </span>

                </div>


                <div class="acciones-seleccion">

                    <button
                        type="button"
                        id="btn-pdf-seleccionadas"
                        class="btn btn-pdf"
                        disabled
                    >
                        <i class="fa-solid fa-file-pdf"></i>
                        PDF
                    </button>


                    <button
                        type="button"
                        id="btn-excel-seleccionadas"
                        class="btn btn-excel"
                        disabled
                    >
                        <i class="fa-solid fa-file-excel"></i>
                        Excel
                    </button>

                </div>

            </div>



            <!-- =====================================================
                 RESUMEN DE BÚSQUEDA AVANZADA
            ====================================================== -->
            <div
                id="resumen-busqueda-avanzada"
                class="resumen-busqueda-avanzada"
                style="display:none;"
            >

                <div class="resumen-avanzado-header">

                    <span>
                        <i class="fa-solid fa-list-check"></i>
                        Resultados
                    </span>

                    <strong id="total-resultados-avanzados">
                        0 guías
                    </strong>

                </div>


                <div
                    id="criterios-busqueda-avanzada"
                    class="criterios-busqueda-avanzada"
                ></div>

            </div>



            <!-- =====================================================
                 RESULTADOS BÚSQUEDA AVANZADA
            ====================================================== -->
            <div
                id="historial-avanzado"
                class="results-container"
                style="display:none;"
            ></div>

            <div id="historial-lista" class="results-container"></div>
            <div id="historial-busqueda" class="results-container" style="display:none;"></div>
        </aside>

        <!-- VISOR -->
        <section class="viewer-panel">
            <div class="viewer-card">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-file-lines"></i> Vista de Guía</h2>
                    <small>Seleccione una guía o procese un XML</small>
                </div>
                <div id="pdf-area" class="viewer-area">
                    <div id="salida" class="viewer-content">
                        <div class="empty-view">
                            <i class="fa-regular fa-file-circle-plus"></i>
                            <h3>No hay ninguna guía cargada</h3>
                            <p>Seleccione una guía del historial o procese un archivo XML.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

</body>
</html>
